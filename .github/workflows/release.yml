name: Publish Telegram Upload

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract release notes
        run: python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build test environment
        run: docker build -f docker/Dockerfile.test -t telegram-upload-test .
      - name: Validate and test
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            -e FLARUM_TEST_TMP_DIR_LOCAL=/app/tests/integration/tmp \
            -e COMPOSER_ROOT_VERSION="$RELEASE_TAG" \
            telegram-upload-test sh -c 'composer install --no-interaction --no-plugins --no-scripts --no-progress && composer validate --strict && composer lint && composer test:setup && composer test && sh tests/permissions.sh'
      - name: Package release
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          base="$RUNNER_TEMP/release-assets/flarum-telegram-upload-$RELEASE_TAG"
          git archive --format=zip --prefix=flarum-telegram-upload/ --output="$base.zip" "$RELEASE_TAG"
          git archive --format=tar.gz --prefix=flarum-telegram-upload/ --output="$base.tar.gz" "$RELEASE_TAG"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Telegram Upload $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --verify-tag --latest --title "Telegram Upload $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
