name: Publish Telegram Upload

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      COMPOSER_ROOT_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev-main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build test environment
        run: docker build -f docker/Dockerfile.test -t telegram-upload-test .
      - name: Validate and test
        run: |
          set +e
          docker run --rm -v "$PWD:/app" -w /app \
            -e FLARUM_TEST_TMP_DIR_LOCAL=/app/tests/integration/tmp \
            -e COMPOSER_ROOT_VERSION \
            telegram-upload-test sh -c 'composer install --no-interaction --no-plugins --no-scripts --no-progress && composer validate --strict && composer lint && composer test:setup && composer test && sh tests/permissions.sh' > "$RUNNER_TEMP/validation.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/validation.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/validation.log" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          errors = [line for line in text.splitlines() if any(term in line for term in ('Fatal error:', 'Exception:', 'Failed asserting', 'There were', 'Tests:', 'Error:', 'Invalid version'))]
          text = '\n'.join(errors)[:3500] if errors else text[-3500:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Validation output::' + escaped)
          PY
          fi
          exit "$result"
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          base="$RUNNER_TEMP/release-assets/flarum-telegram-upload-$RELEASE_TAG"
          git archive --format=zip --prefix=flarum-telegram-upload/ --output="$base.zip" "$RELEASE_TAG"
          git archive --format=tar.gz --prefix=flarum-telegram-upload/ --output="$base.tar.gz" "$RELEASE_TAG"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Telegram Upload $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --verify-tag --latest --title "Telegram Upload $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
