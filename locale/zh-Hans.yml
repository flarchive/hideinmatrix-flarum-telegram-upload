fof-upload:
  admin:
    upload_methods:
      telegram: tg-disk（Telegram / R2，10 MiB）

hideinmatrix-telegram-upload:
  admin:
    base_url_label: tg-disk 站点 URL
    base_url_help: 只填写 HTTPS 站点地址，例如 https://pan.example.com，不含 /api/telegram/send。
    provider_label: 新上传文件的存储方式
    provider_help: 切换后只影响新上传。每个附件保存上传时的完整直链，已有 Telegram 或 R2 文件地址不变。
    upload_url_label: 上传接口 URL（旧版）
    upload_url_help: 填写完整 HTTPS 接口地址，以 /api/telegram/send 结尾。不要包含密钥或查询参数。
    api_key_help: 填写与 tg-disk 服务端 NUXT_API_KEY 相同的密钥，至少 32 个字符。仅管理员可读取，不会发送到论坛公开 API。
    chat_id_label: 上传频道 ID
    chat_id_help: 仅 Telegram 上传需要填写数字频道 ID（通常以 -100 开头）。R2 无需频道 ID，存储桶在 tg-disk 侧配置。
    errors:
      base_url: 请填写 HTTPS 站点地址，不含上传接口路径、账号、查询参数或片段。
      provider: 请选择 Telegram 或 Cloudflare R2。
      upload_url: 请填写以 /api/telegram/send 结尾的完整 HTTPS 接口地址，不含账号、查询参数或片段。
      api_key: API Key 至少需要 32 个字符，不能包含换行等控制字符。
      chat_id: 请填写 Telegram 数字频道 ID。
  api:
    too_large: 附件大小不能超过 10 MiB。
    upload_failed: tg-disk 上传失败，请检查 tg-disk 配置后重试。
    authentication_failed: tg-disk 拒绝鉴权，请检查 API Key 和上游访问策略。
